<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="beak-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <linearGradient id="beak-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Precision Dashed Telemetry Ring -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="3.5" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- 100% Watertight Solid Base Silhouette: Aerodynamic Perched Raptor -->
      <path d="
        M 0,-330
        L 45,-345 L 85,-290 L 145,-285 L 185,-215 L 255,-160 L 305,-60
        L 310,40 L 270,140 L 205,230 L 120,290 L 0,335
        L -120,290 L -205,230 L -270,140 L -310,40 L -305,-60
        L -255,-160 L -185,-215 L -145,-285 L -85,-290 L -45,-345
        Z
      " fill="#090d16" />

      <!-- Top Crown & Crest Plumes (Sharp raptor horns/crest) -->
      <polygon points="0,-330 -45,-345 -20,-280" fill="#1e293b" />
      <polygon points="0,-330 45,-345 20,-280" fill="#334155" />
      <polygon points="-45,-345 -85,-290 -35,-265" fill="#0f172a" />
      <polygon points="45,-345 85,-290 35,-265" fill="#1e293b" />
      <polygon points="-85,-290 -145,-285 -95,-240" fill="#1e293b" />
      <polygon points="85,-290 145,-285 95,-240" fill="#334155" />

      <!-- Forehead & Cranial Ridge -->
      <polygon points="0,-330 -20,-280 0,-225" fill="#1e293b" />
      <polygon points="0,-330 20,-280 0,-225" fill="#334155" />
      <polygon points="-20,-280 -95,-240 -55,-210 0,-225" fill="#0f172a" />
      <polygon points="20,-280 95,-240 55,-210 0,-225" fill="#1e293b" />

      <polygon points="0,-225 -55,-210 -45,-165 0,-165" fill="#334155" />
      <polygon points="0,-225 55,-210 45,-165 0,-165" fill="#475569" />

      <!-- Beak Bridge -->
      <polygon points="0,-165 -45,-165 -30,-100 0,-95" fill="#0f172a" />
      <polygon points="0,-165 45,-165 30,-100 0,-95" fill="#1e293b" />

      <!-- Curved Predatory Hook Beak -->
      <polygon points="0,-165 -30,-100 0,-40" fill="url(#beak-left)" />
      <polygon points="0,-165 30,-100 0,-40" fill="url(#beak-right)" />
      <polygon points="0,-95 -22,-105 0,-40" fill="#0284c7" opacity="0.6" />
      <polygon points="0,-95 22,-105 0,-40" fill="#0369a1" opacity="0.6" />

      <!-- Lower Jaw & Throat Base -->
      <polygon points="0,-40 -25,-60 0,-20" fill="#090d16" />
      <polygon points="0,-40 25,-60 0,-20" fill="#1e293b" />

      <!-- Sharp Predatory Eye Sockets (Upward Canted Almonds) -->
      <!-- Left Eye -->
      <polygon points="-55,-210 -145,-220 -165,-165 -105,-160" fill="#090d16" />
      <polygon points="-105,-160 -165,-165 -135,-140 -80,-150" fill="#1e293b" />
      <!-- Left Iris & Slit -->
      <polygon points="-90,-172 -135,-172 -118,-158" fill="#00f5ff" />
      <polygon points="-105,-172 -122,-172 -115,-162" fill="#ffffff" />
      <!-- Brow Shield Plate -->
      <polygon points="-55,-210 -145,-220 -105,-190" fill="#475569" />

      <!-- Right Eye -->
      <polygon points="55,-210 145,-220 165,-165 105,-160" fill="#1e293b" />
      <polygon points="105,-160 165,-165 135,-140 80,-150" fill="#334155" />
      <!-- Right Iris & Slit -->
      <polygon points="90,-172 135,-172 118,-158" fill="#00f5ff" />
      <polygon points="105,-172 122,-172 115,-162" fill="#ffffff" />
      <!-- Brow Shield Plate -->
      <polygon points="55,-210 145,-220 105,-190" fill="#64748b" />

      <!-- Lateral Cheeks & Flanks -->
      <polygon points="-145,-220 -185,-215 -255,-160 -165,-165" fill="#0f172a" />
      <polygon points="145,-220 185,-215 255,-160 165,-165" fill="#1e293b" />

      <polygon points="-165,-165 -255,-160 -210,-85 -135,-140" fill="#1e293b" />
      <polygon points="165,-165 255,-160 210,-85 135,-140" fill="#334155" />

      <!-- Cheek Malar Triangles (Titanium Slate) -->
      <polygon points="-135,-140 -210,-85 -155,-40 -80,-105" fill="#334155" />
      <polygon points="135,-140 210,-85 155,-40 80,-105" fill="#475569" />

      <polygon points="-80,-105 -155,-40 -95,-10 0,-20" fill="#1e293b" />
      <polygon points="80,-105 155,-40 95,-10 0,-20" fill="#334155" />

      <!-- Throat & Harbor Mooring Bitt Core (Negative-Space Technical Anchor) -->
      <polygon points="0,-20 -95,-10 0,70" fill="#0f172a" />
      <polygon points="0,-20 95,-10 0,70" fill="#1e293b" />

      <!-- Electric Cyan Core Heartbeat Node -->
      <polygon points="0,15 -24,55 0,90 24,55" fill="url(#cyan-glow)" />

      <!-- Broad Aerodynamic Shoulder Mantle (Wings) -->
      <polygon points="-210,-85 -305,-60 -310,40 -215,25 -155,-40" fill="#0b0f19" />
      <polygon points="210,-85 305,-60 310,40 215,25 155,-40" fill="#1e293b" />

      <polygon points="-155,-40 -215,25 -135,75 -95,-10" fill="#1e293b" />
      <polygon points="155,-40 215,25 135,75 95,-10" fill="#334155" />

      <!-- Mid Flight Wings (Layered downward angular armor) -->
      <polygon points="-310,40 -270,140 -195,150 -215,25" fill="#0f172a" />
      <polygon points="310,40 270,140 195,150 215,25" fill="#1e293b" />

      <polygon points="-215,25 -195,150 -115,170 -135,75" fill="#334155" />
      <polygon points="215,25 195,150 115,170 135,75" fill="#475569" />

      <!-- Primary Flight Feathers (Tapering to dock tail) -->
      <polygon points="-270,140 -205,230 -140,225 -195,150" fill="#1e293b" />
      <polygon points="270,140 205,230 140,225 195,150" fill="#334155" />

      <!-- Pectoral Shield Center -->
      <polygon points="0,70 -135,75 -115,170 0,180" fill="#1e293b" />
      <polygon points="0,70 135,75 115,170 0,180" fill="#334155" />

      <polygon points="0,180 -115,170 -70,265 0,275" fill="#0f172a" />
      <polygon points="0,180 115,170 70,265 0,275" fill="#1e293b" />

      <!-- Tail Rudders (Dock Bitt Taper) -->
      <polygon points="-205,230 -120,290 -65,285 -140,225" fill="#090d16" />
      <polygon points="205,230 120,290 65,285 140,225" fill="#1e293b" />

      <polygon points="-120,290 -55,325 0,335 0,275 -70,265" fill="#1e293b" />
      <polygon points="120,290 55,325 0,335 0,275 70,265" fill="#334155" />

      <!-- Electric Cyan Under-Wing Laser Inset -->
      <polygon points="-24,55 0,90 -16,120" fill="#00f5ff" opacity="0.35" />
      <polygon points="24,55 0,90 16,120" fill="#0284c7" opacity="0.35" />

    </g>
  </g>
</svg>